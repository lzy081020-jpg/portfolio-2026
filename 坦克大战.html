  // ---------- 游戏中 ----------
  drawPlaying(ctx) {
    // 地图下层
    this.tiles.draw(ctx, 0);
    // 地雷
    for (const m of this.mines) {
      ctx.fillStyle = '#AA66FF';
      ctx.shadowBlur = 10; ctx.shadowColor = '#AA66FF';
      ctx.beginPath(); ctx.arc(m.x, m.y, 5 + Math.sin(this.time * 0.3) * 1.5, 0, TAU); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#AA66FF44';
      ctx.beginPath(); ctx.arc(m.x, m.y, m.ar * (0.5 + 0.5 * Math.sin(this.time * 0.1)), 0, TAU); ctx.stroke();
    }
    // 道具（补血 + 护盾）
    for (const p of this.pickups) {
      const yo = Math.sin(p.bob) * 3;
      const blink = p.life < 150 ? (Math.floor(p.life / 8) % 2 === 0 ? 1 : 0.3) : 1;
      ctx.globalAlpha = blink;
      if (p.type === 'heal') {
        // 补血道具: 绿色十字 + 光圈
        ctx.shadowBlur = 12; ctx.shadowColor = '#00FF88';
        ctx.fillStyle = '#00FF88';
        ctx.beginPath(); ctx.arc(p.x, p.y + yo, 14, 0, TAU); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#003322';
        ctx.fillRect(p.x - 2, p.y + yo - 8, 4, 16);
        ctx.fillRect(p.x - 8, p.y + yo - 2, 16, 4);
      } else {
        // 护盾道具: 青色盾牌 + 光圈
        ctx.shadowBlur = 12; ctx.shadowColor = '#00F0FF';
        ctx.fillStyle = '#00F0FF';
        ctx.beginPath();
        ctx.moveTo(p.x, p.y + yo - 12);
        ctx.lineTo(p.x + 11, p.y + yo - 6);
        ctx.lineTo(p.x + 11, p.y + yo + 4);
        ctx.lineTo(p.x, p.y + yo + 12);
        ctx.lineTo(p.x - 11, p.y + yo + 4);
        ctx.lineTo(p.x - 11, p.y + yo - 6);
        ctx.closePath(); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#003344';
        ctx.font = 'bold 12px monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('S', p.x, p.y + yo);
      }
      // 底部光圈
      ctx.strokeStyle = p.type === 'heal' ? 'rgba(0,255,136,0.4)' : 'rgba(0,240,255,0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y + yo, 18 + Math.sin(p.bob * 2) * 2, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    // 子弹
    for (const b of this.bullets) b.draw(ctx);
    // 敌人
    for (const e of this.enemies) e.draw(ctx);
    // BOSS
    if (this.boss) this.boss.draw(ctx);
    // 玩家
    if (this.player) this.player.draw(ctx);
    // 草丛上层
    this.tiles.draw(ctx, 1);
    // 粒子
    this.ps.draw(ctx);
    // HUD
    this.drawHUD(ctx);
  },
  drawHUD(ctx) {
    if (!this.player) return;
    const p = this.player;
    // 顶部背景条
    ctx.fillStyle = 'rgba(3,8,20,0.7)';
    ctx.fillRect(0, 0, CW, 46);
    ctx.strokeStyle = '#1c3a66'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, 46); ctx.lineTo(CW, 46); ctx.stroke();
    // 血条
    ctx.fillStyle = '#4a2030';
    ctx.fillRect(16, 12, 180, 14);
    ctx.fillStyle = '#ff3366';
    ctx.shadowBlur = 8; ctx.shadowColor = '#ff3366';
    ctx.fillRect(16, 12, 180 * (p.hp / p.totalMaxHp()), 14);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ff6688'; ctx.lineWidth = 1;
    ctx.strokeRect(16, 12, 180, 14);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText(`HP ${Math.ceil(p.hp)}/${p.totalMaxHp()}`, 106, 23);
    // 能量条(技能CD)
    const energyFull = p.skillTimer <= 0;
    ctx.fillStyle = '#103040';
    ctx.fillRect(16, 30, 180, 8);
    ctx.fillStyle = energyFull ? p.color : '#446677';
    if (energyFull) { ctx.shadowBlur = 8; ctx.shadowColor = p.color; }
    ctx.fillRect(16, 30, 180 * (1 - clamp(p.skillTimer / (p.skillCD * p.cdMult), 0, 1)), 8);
    ctx.shadowBlur = 0;
    // 分数 / 关卡
    ctx.fillStyle = '#00f0ff'; ctx.font = 'bold 14px "Microsoft YaHei"';
    ctx.textAlign = 'left';
    ctx.fillText(`分数 ${this.score}`, 220, 24);
    ctx.fillStyle = '#FFD700';
    ctx.fillText(`关卡 ${this.level}/9`, 220, 40);
    if (this.oneLife) {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#00FF88'; ctx.font = 'bold 12px "Microsoft YaHei"';
      ctx.shadowBlur = 8; ctx.shadowColor = '#00FF88';
      ctx.fillText('★ 一命通关挑战中 ★', CW / 2, 24);
      ctx.shadowBlur = 0;
      ctx.textAlign = 'left'; ctx.font = 'bold 14px "Microsoft YaHei"';
    }
    ctx.fillStyle = '#9fd8ff';
    ctx.fillText(`金币 ${this.runCoins}`, 340, 24);
    if (this.boss) { ctx.fillStyle = '#ff3366'; ctx.fillText('BOSS战!', 340, 40); }
    else { ctx.fillStyle = '#7fb8e0'; ctx.fillText(`敌人 ${this.enemies.length} + ${this.enemiesToSpawn}`, 340, 40); }
    ctx.textAlign = 'right';
    ctx.fillStyle = '#6fd0ff'; ctx.font = '12px "Microsoft YaHei"';
    ctx.fillText(`坦克: ${p.cfg.name}`, CW - 16, 24);
    ctx.fillText(`击杀 ${p.kills}`, CW - 16, 40);
    ctx.textAlign = 'left';

    // 底部技能/道具栏
    ctx.fillStyle = 'rgba(3,8,20,0.7)';
    ctx.fillRect(0, CH - 50, CW, 50);
    ctx.strokeStyle = '#1c3a66';
    ctx.beginPath(); ctx.moveTo(0, CH - 50); ctx.lineTo(CW, CH - 50); ctx.stroke();
    // 技能图标
    this.drawSlot(ctx, 16, CH - 42, 34, 34, p.color, p.skillName.charAt(0), p.skillTimer <= 0, p.skillTimer / (p.skillCD * p.cdMult));
    ctx.fillStyle = '#9fd8ff'; ctx.font = '10px "Microsoft YaHei"';
    ctx.fillText(p.skillName, 56, CH - 28);
    ctx.fillStyle = '#4a6a8a';
    ctx.fillText('Shift/右键', 56, CH - 14);
    // 道具
    const items = [
      { key: 'shield', label: '护盾', count: this.consumables.shield, key2: 'E' },
      { key: 'bomb', label: '炸弹', count: this.consumables.bomb, key2: 'Q' },
      { key: 'repair', label: '修复', count: this.consumables.repair, key2: 'R' },
    ];
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      const x = 200 + i * 90;
      const hover = this.inRect(x, CH - 42, 34, 34);
      this.drawSlot(ctx, x, CH - 42, 34, 34, it.count > 0 ? '#00FF88' : '#334455', it.label.charAt(0), it.count > 0, 0, hover);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 12px "Microsoft YaHei"';
      ctx.fillText(`x${it.count}`, x + 38, CH - 22);
      ctx.fillStyle = '#4a6a8a'; ctx.font = '10px "Microsoft YaHei"';
      ctx.fillText(`${it.label} ${it.key2}`, x, CH - 4);
      if (hover && this.scene === 'playing') {
        this.buttons.push({ x, y: CH - 42, w: 34, h: 34, act: () => this.useConsumable(it.key) });
      }
    }
    // 提示
    ctx.fillStyle = '#3a5070'; ctx.font = '10px "Microsoft YaHei"';
    ctx.textAlign = 'right';
    ctx.fillText('P 暂停  ·  Esc 退出关卡(保留金币)', CW - 16, CH - 10);
    ctx.textAlign = 'left';
  },
  drawSlot(ctx, x, y, w, h, color, label, ready, cdRatio, hover) {
    ctx.fillStyle = ready ? (hover ? 'rgba(0,255,136,0.2)' : 'rgba(0,40,30,0.7)') : 'rgba(20,20,30,0.7)';
    ctx.strokeStyle = ready ? color : '#334455';
    ctx.lineWidth = ready ? 2 : 1;
    if (ready) { ctx.shadowBlur = 8; ctx.shadowColor = color; }
    roundRect(ctx, x, y, w, h, 5); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    if (!ready && cdRatio > 0) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(x, y + h * (1 - cdRatio), w, h * cdRatio);
    }
    ctx.fillStyle = ready ? color : '#556677';
    ctx.font = 'bold 16px "Microsoft YaHei"';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, x + w / 2, y + h / 2);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  },

  // ---------- 暂停 ----------
  drawPaused(ctx) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, CW, CH);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#00f0ff';
    ctx.shadowBlur = 18; ctx.shadowColor = '#00f0ff';

    ctx.fillText('暂  停', CW / 2, 240);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#9fd8ff'; ctx.font = '18px "Microsoft YaHei"';

    ctx.fillStyle = '#6fd0ff'; ctx.font = '14px "Microsoft YaHei"';
    ctx.fillText(`当前关卡 ${this.level}  ·  分数 ${this.score}  ·  本局金币 ${this.runCoins}`, CW / 2, 340);
    ctx.textAlign = 'left';
  },

  // ---------- 升级选择 ----------
  drawUpgrade(ctx) {
    this.buttons = [];
    ctx.fillStyle = 'rgba(0,5,15,0.85)';
    ctx.fillRect(0, 0, CW, CH);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#FFD700';
    ctx.shadowBlur = 14; ctx.shadowColor = '#FFD700';
    ctx.font = 'bold 38px "Microsoft YaHei"';
    ctx.fillText('关卡通过! 选择强化', CW / 2, 90);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#6fd0ff'; ctx.font = '13px "Microsoft YaHei"';
    ctx.fillText(`第 ${this.level} 关完成  ·  进入第 ${this.level + 1} 关`, CW / 2, 118);

    const cats = { attack: '#ff6644', defense: '#00FF88', speed: '#00f0ff', special: '#AA66FF' };
    const cardW = 200, cardH = 260, gap = 20;
    const totalW = 3 * cardW + 2 * gap;
    const startX = (CW - totalW) / 2;
    for (let i = 0; i < this.upgradeChoices.length; i++) {
      const u = this.upgradeChoices[i];
      const x = startX + i * (cardW + gap), y = 160;
      const hover = this.inRect(x, y, cardW, cardH);
      const col = cats[u.cat] || '#fff';
      ctx.fillStyle = hover ? 'rgba(20,40,70,0.92)' : 'rgba(5,15,30,0.9)';
      ctx.strokeStyle = hover ? col : '#1c3a66';
      ctx.lineWidth = hover ? 2.5 : 1.5;
      ctx.shadowBlur = hover ? 18 : 6; ctx.shadowColor = col;
      roundRect(ctx, x, y, cardW, cardH, 10); ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      // 类别
      ctx.fillStyle = col; ctx.font = 'bold 12px "Microsoft YaHei"';
      const catName = { attack: '攻击', defense: '防御', speed: '速度', special: '特殊' }[u.cat];
      ctx.fillText(catName, x + cardW / 2, y + 36);
      // 图标圆
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.shadowBlur = 10; ctx.shadowColor = col;
      ctx.beginPath(); ctx.arc(x + cardW / 2, y + 90, 28, 0, TAU); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = col; ctx.font = 'bold 22px "Microsoft YaHei"';
      ctx.fillText(u.name.charAt(0), x + cardW / 2, y + 100);
      // 名称
      ctx.fillStyle = '#fff'; ctx.font = 'bold 17px "Microsoft YaHei"';
      ctx.fillText(u.name, x + cardW / 2, y + 150);
      // 描述
      ctx.fillStyle = '#9fd8ff'; ctx.font = '12px "Microsoft YaHei"';
      this.wrapText(ctx, u.desc, x + cardW / 2, y + 178, cardW - 24, 16);
      // 选择提示
      ctx.fillStyle = hover ? col : '#5a7090'; ctx.font = 'bold 13px "Microsoft YaHei"';
      ctx.fillText(hover ? '▶ 点击选择' : '点击选择', x + cardW / 2, y + cardH - 20);
      this.buttons.push({ x, y, w: cardW, h: cardH, act: () => this.pickUpgrade(i) });
    }
    ctx.textAlign = 'left';
  },
  wrapText(ctx, text, cx, y, maxW, lh) {
    const chars = text.split('');
    let line = '';
    let yy = y;
    ctx.textAlign = 'center';
    for (const c of chars) {
      const test = line + c;
      if (ctx.measureText(test).width > maxW) {
        ctx.fillText(line, cx, yy); line = c; yy += lh;
      } else line = test;
    }
    if (line) ctx.fillText(line, cx, yy);
    ctx.textAlign = 'left';
  },

  // ---------- BOSS 警告 ----------
  drawBossWarn(ctx) {
    ctx.fillStyle = 'rgba(40,0,10,0.55)';
    ctx.fillRect(0, 0, CW, CH);
    const t = 150 - this.bossWarnTimer;
    const blink = Math.sin(t * 0.4) > 0;
    ctx.textAlign = 'center';
    ctx.fillStyle = blink ? '#ff0033' : '#ff5566';
    ctx.shadowBlur = 24; ctx.shadowColor = '#ff0033';
    ctx.font = 'bold 84px "Microsoft YaHei"';
    ctx.fillText('W A R N I N G', CW / 2, CH / 2 - 20);
    ctx.shadowBlur = 0;
    const bossName = this.pendingBoss ? BOSS_TYPES[this.pendingBoss].name : 'BOSS';
    ctx.fillStyle = '#ff8866'; ctx.font = 'bold 28px "Microsoft YaHei"';
    ctx.fillText(`${bossName} 即将降临`, CW / 2, CH / 2 + 30);
    ctx.fillStyle = '#ffaa88'; ctx.font = '14px "Microsoft YaHei"';
    ctx.fillText(`第 ${this.level} 关 · BOSS 战`, CW / 2, CH / 2 + 60);
    // 扫描线
    ctx.strokeStyle = 'rgba(255,0,51,0.25)';
    ctx.lineWidth = 2;
    const sy = (t * 8) % CH;
    ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(CW, sy); ctx.stroke();
    ctx.textAlign = 'left';
  },

  // ---------- 游戏结束 ----------
  drawGameOver(ctx) {
    this.buttons = [];
    ctx.fillStyle = 'rgba(0,0,0,0.82)';
    ctx.fillRect(0, 0, CW, CH);
    const win = this.gameResult && this.gameResult.win;
    const oneLifeClear = this.gameResult && this.gameResult.oneLifeClear;
    const oneLifeFail = this.gameResult && this.gameResult.oneLifeFail;
    ctx.textAlign = 'center';
    ctx.fillStyle = oneLifeClear ? '#00FF88' : (win ? '#FFD700' : '#ff3366');
    ctx.shadowBlur = 20; ctx.shadowColor = ctx.fillStyle;
    ctx.font = 'bold 60px "Microsoft YaHei"';
    ctx.fillText(oneLifeClear ? '一命通关!' : (win ? '胜  利!' : '游戏结束'), CW / 2, 180);
    ctx.shadowBlur = 0;
    if (oneLifeClear) {
      ctx.fillStyle = '#00FF88'; ctx.font = 'bold 16px "Microsoft YaHei"';
      ctx.shadowBlur = 10; ctx.shadowColor = '#00FF88';
      ctx.fillText('★ 从第1关打到第9关未死亡，达成一命通关! ★', CW / 2, 212);
      ctx.shadowBlur = 0;
    }
    if (this.gameResult) {
      ctx.fillStyle = '#9fd8ff'; ctx.font = '18px "Microsoft YaHei"';
      ctx.fillText(`最终分数: ${this.gameResult.score}`, CW / 2, 250);
      ctx.fillText(`到达关卡: ${this.gameResult.level}/9`, CW / 2, 280);
      ctx.fillStyle = '#FFD700';
      ctx.fillText(`获得金币: ${this.gameResult.coins}`, CW / 2, 310);
    }
    // 死亡时提示下次从检查点继续
    if (!win && this.gameResult) {
      const cp = this.gameResult.checkpoint || this.save.data.checkpoint || 1;
      ctx.fillStyle = '#00f0ff'; ctx.font = 'bold 14px "Microsoft YaHei"';
      if (cp > 1 && cp <= 9) {
        ctx.fillText(`进度已保存，下次从第 ${cp} 关继续`, CW / 2, 344);
      } else if (oneLifeFail) {
        ctx.fillText('一命通关失败，再接再厉!', CW / 2, 344);
      }
    }
    ctx.fillStyle = '#6fd0ff'; ctx.font = '13px "Microsoft YaHei"';
    ctx.fillText(`最高分: ${this.save.data.bestScore}  ·  最高关卡: ${this.save.data.bestLevel}`, CW / 2, 366);

    const againHover = this.inRect(CW / 2 - 230, 400, 220, 50);
    this.drawButton(CW / 2 - 230, 400, 220, 50, '再玩一次', againHover);
    this.buttons.push({ x: CW / 2 - 230, y: 400, w: 220, h: 50, act: () => { this.scene = 'tankSelect'; } });
    const menuHover = this.inRect(CW / 2 + 10, 400, 220, 50);
    this.drawButton(CW / 2 + 10, 400, 220, 50, '返回菜单', menuHover);
    this.buttons.push({ x: CW / 2 + 10, y: 400, w: 220, h: 50, act: () => { this.scene = 'menu'; } });
    ctx.textAlign = 'left';
  },

  // ---------- 点击处理 ----------
  handleClick(mx, my) {
    for (const b of this.buttons) {
      if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
        b.act(); return;
      }
    }
  },

  // ---------- 主循环 ----------
  loop(t) {
    const dt = Math.min(50, t - this.lastT || 16);
    this.lastT = t;
    const f = dt / 16.67; // 帧倍率
    // 按钮(每帧重建于draw)，先更新再绘制
    this.update(f);
    this.draw();
    this.mouse.clicked = false;
    requestAnimationFrame((tt) => this.loop(tt));
  }
};

// ===================== 启动 =====================
G.init();
</script>
</body>
</html>
