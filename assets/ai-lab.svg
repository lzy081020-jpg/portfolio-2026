  <g font-family="monospace" font-size="28" fill="#c8fbe0"><text x="170" y="280">def idea_to_prototype(prompt):</text><text x="215" y="335" fill="#42e8ff">plan = decompose(prompt)</text><text x="215" y="390" fill="#80ffb7">code = ai.generate(plan)</text><text x="215" y="445" fill="#f1d54a">result = test(code)</text><text x="215" y="500" fill="#ff83bd">return iterate(result)</text></g>
